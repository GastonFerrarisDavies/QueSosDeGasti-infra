name: CD

# Un push a main que toque Terraform significa que cambió la arquitectura o el
# digest de alguna imagen (commit del CI de backend/frontend): se aplica.
# En PRs solo se muestra el plan.
on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "backend.hcl"
      - "templates/**"
      - "files/**"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "backend.hcl"
      - "templates/**"
      - "files/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: "Re-ejecutar el despliegue en la VM aunque no haya cambios"
        type: boolean
        default: false

permissions:
  id-token: write # OIDC contra Azure
  contents: read

# Un solo apply a la vez sobre el mismo estado; los pushes seguidos se encolan.
concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
  TF_VAR_ghcr_username: ${{ secrets.GHCR_USERNAME }}
  TF_VAR_ghcr_token: ${{ secrets.GHCR_PULL_TOKEN }}
  TF_VAR_ssh_allowed_cidr: ${{ vars.SSH_ALLOWED_CIDR || '*' }}
  TF_VAR_deploy_revision: ${{ inputs.force_redeploy && github.run_id || '' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend-config=backend.hcl

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -out=tfplan -no-color | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply tfplan

      - name: Outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          {
            echo '### Outputs'
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
